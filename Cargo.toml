[package]
name = "ftdc-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["parquet", "cli"]
parquet = ["dep:polars"]
cli = ["dep:clap", "dep:regex", "dep:env_logger", "dep:log"]

[dependencies]
bson = "2.15.0"
zune-inflate = "0.2.54"
serde_json = "1.0.140"
clap = { version = "4.5.53", features = ["derive"], optional = true }
polars = { version = "0.49.1", optional = true, features = ["lazy", "parquet", "polars-io"] }
env_logger = { version = "0.11.8", optional = true }
indexmap = "2"
thiserror = "2.0.12"
regex = { version = "1.12.2", optional = true }
log = { version = "0.4", optional = true }

[[bin]]
name = "ftdc-rs"
path = "src/main.rs"
required-features = ["parquet", "cli"]

[dev-dependencies]
flate2 = "1"
